<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício13</title>
    <link rel="stylesheet" href="ex13.css">
</head>
<body>

    <a href="../" class="btn-voltar">⬅ Voltar ao Menu</a>
    
    <main class="container">
        <span class="etiqueta">Exercício 13</span>
        <h1>Laboratório de Variáveis</h1>
        <p class="introdução">Altere os valores e observe o papel de var, let e const</p>

    <section class="painel-variaveis">

        <article class="cartão var">
            <h2>var</h2>
            <p>Nome do projeto</p>
            <strong id="valorVar">Projeto Front-End</strong>
        </article>

        <article class="cartão let">
            <h2>let</h2>
            <p>Pontuação atual</p>
            <strong id="valorLet">0</strong>
        </article>

        <article class="cartão const">
            <h2>const</h2>
            <p>Limite de pontos</p>
            <strong id="valorConst">50</strong>
        </article>
    
    </section>

    <label for="nomeProjeto">Novo nome do projeto:</label>
    <input type="text" id="nomeProjeto" placeholder="Ex: Portal 2DS">

    <label for="pontosAdicionar">Pontos para adicionar</label>
    <input type="number" id="pontosAdicionar" min="1" max="50" placeholder="Ex: 10">

    <div class="botões">
        
        <button onclick="atualizarPainel()">Atualizar valores</button>
        <button class="secundario" onclick="reniciarPainel()">Reniciar</button>

    </div>

    <section class="resultado">
        <h2>Resultados</h2>
        <p id="mensagem">Preencha os campos para testar variaveis</p>
        <p id="resumo"></p>

    </section>
    
    </main>

    <script src="ex13.js"></script>
    
</body>
</html>
